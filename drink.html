<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>What do you want to drink? 💗</title>

  <link rel="stylesheet" href="style.css">
  <script src="drink.js" defer></script>
</head>

<body>

  <main class="card">
    <div class="envelope">🧋</div>

    <p class="eyebrow">One more thing</p>

    <h1>What do you want to drink?</h1>

    <p id="previousChoices" class="small"></p>

    <div class="food-options" id="drinkOptions">
      <label><input type="radio" name="drinkChoice" value="Milktea"> Milktea</label>
      <label><input type="radio" name="drinkChoice" value="Coffee"> Coffee</label>
    </div>

    <button class="confirm" id="drinkNextBtn" type="button" disabled>
      Next 💌
    </button>

    <footer class="footer">
      Made with a little courage and a lot of 💗
    </footer>
  </main>

</body>
</html>
