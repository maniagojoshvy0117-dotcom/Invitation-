<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Where do you want to eat? 💗</title>

  <link rel="stylesheet" href="style.css">
  <script src="food.js" defer></script>
</head>

<body>

  <main class="card">
    <div class="envelope">🍽️</div>

    <p class="eyebrow">Let's plan our date</p>

    <h1>Where do you want to eat?</h1>

    <p id="dateChoice" class="small"></p>

    <div class="food-options">
      <label><input type="radio" name="foodChoice" value="Jollibee"> Jollibee</label>
      <label><input type="radio" name="foodChoice" value="Mcdo"> Mcdo</label>
      <label><input type="radio" name="foodChoice" value="Chowking"> Chowking</label>
      <label><input type="radio" name="foodChoice" value="KFC"> KFC</label>
      <label><input type="radio" name="foodChoice" value="Food Court"> Food Court</label>
      <label class="other-option">
        <input type="radio" name="foodChoice" value="Others">
        <span>Others...</span>
        <input id="otherFood" type="text" aria-label="Type another place to eat"
          placeholder="Type your choice">
      </label>
    </div>

    <button class="confirm" id="foodNextBtn" type="button" disabled>
      Next 💌
    </button>

    <footer class="footer">
      Can't wait to go with you 💗
    </footer>
  </main>

</body>
</html>
