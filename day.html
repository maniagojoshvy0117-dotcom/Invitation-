<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose a Day 💗</title>

  <link rel="stylesheet" href="style.css">
  <script src="day.js" defer></script>
</head>

<body>

  <main class="card">
    <div class="envelope">💖</div>

    <p class="eyebrow">Yay!</p>

    <h1>Which day works best?</h1>

    <p>That makes me happy! Which day next week works best for you?</p>

    <div class="days" id="days"></div>

    <button class="confirm" id="confirmBtn" type="button" disabled>
      Choose a day first 💌
    </button>

    <footer class="footer">
      Can't wait to spend time with you 💗
    </footer>
  </main>

</body>
</html>
